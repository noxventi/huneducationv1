<section class="cost section" id="maliyet" aria-labelledby="cost-h">
  <div class="shell cost__inner">
    <div class="cost__left">
      <p class="eyebrow" data-reveal="up-sm">Maliyet görünürlüğü</p>
      <h2 class="h-md display" id="cost-h" data-reveal="up">Bütçenizi daha baştan planlayın</h2>
      <p class="lede" data-reveal="up" data-reveal-delay="80">
        Bir yılın maliyeti yalnızca öğrenim ücretinden ibaret değildir. Aşağıdan eğitim seviyenizi
        ve konaklama tercihinizi seçin; yıllık bütçenizin kalem kalem nasıl dağıldığını hemen görün.
      </p>

      <a class="btn btn--dark" href="#gorusme" data-magnetic data-reveal="up" data-reveal-delay="200">
        <span class="btn__label"><span data-t="Bana Özel Bütçe Planı İstiyorum">Bana Özel Bütçe Planı İstiyorum</span></span>
      </a>
    </div>

    <div class="ccard" data-cost>
      <header class="ccard__head">
        <span class="ccard__label">Tahmini yıllık maliyet</span>
        <strong class="ccard__total num-mono" data-cost-total>&hellip;</strong>
        <span class="ccard__scenario" data-cost-scenario></span>
      </header>

      <div class="ccard__controls" data-cost-controls></div>

      <ul class="ccard__rows" data-cost-list></ul>

      <footer class="ccard__foot">
        <p data-cost-note></p>
      </footer>
    </div>
  </div>
</section>
